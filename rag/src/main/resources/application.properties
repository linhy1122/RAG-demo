﻿﻿spring.application.name=rag
# ============ Spring AI 2.0 - OpenAI ?????LM Studio? ============
# LM Studio ????????
spring.ai.openai.base-url=http://localhost:1234/v1
# LM Studio ?????????????
spring.ai.openai.api-key=lm-studio
# ?????google/gemma-4-e4b
spring.ai.openai.chat.options.model=google/gemma-4-e4b
spring.ai.openai.chat.options.temperature=0.7
# ???????text-embedding-bge-m3
spring.ai.openai.embedding.options.model=text-embedding-bge-m3
# ============ Knife4j / OpenAPI ?? ============
knife4j.enable=true
knife4j.setting.language=zh_cn
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ============ Milvus 3.0 REST API v2 ============
# Milvus server address (REST API v2 served on gRPC port 19530)
rag.milvus.base-url=http://localhost:19530
# Target collection (knowledge base) name
# Milvus rule: only numbers, letters and underscores are allowed (no hyphen)
rag.milvus.collection=rag_xmut
# Embedding dimension: 0 = auto-detect from embedding model on first ingestion
rag.milvus.embedding-dimension=0
# ============ Document ingestion ============
# Chunks per embed+insert batch
rag.ingest.batch-size=16
# Default topK for similarity search
rag.ingest.default-top-k=5
# 入库前是否 Drop 重建 collection 清空旧数据（含索引重建）；仅 embed 全部成功后执行
rag.ingest.clear-before-ingest=true
# ============ Document cleaning ============
# 入库清洗开关（曲调行/目录过滤 + 表格原子保留）
rag.clean.enabled=true
# 单一表块最大字节数（UTF-8），超过则按行二次切分（表头+分隔行保留到各子块）。
# 与 Milvus text 字段 max_length=2048 对齐，默认 1500 留余量；联调可调：切得过碎上调至 1800，插
# 入报长度错误则下调
rag.clean.table-max-bytes=1500
# rag.test.* 与生产配置隔离；联调验证 embed 失败路径，上线前必须为 false
rag.test.simulate-embed-failure=false
# ============ File upload ============
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
# ============ Multi-turn QA ============
# Default number of chunks retrieved per question (overridable by request param topK, clamped to [1,20]);
# calibrated from live debugging: the exact-date chunk ranks 7th-9th for rewritten follow-up queries
# (rewrite wording varies slightly), so the initial 5 missed it and 10 covers the observed range
rag.chat.top-k=10
# Similarity threshold (COSINE, higher = more similar); calibrated from live debugging (case 10):
# on-topic chunks score 0.65-0.85, off-topic ones (e.g. weather) 0.49-0.54, so 0.60 splits the gap
rag.chat.score-threshold=0.60
# Session memory window (keep last N messages, including user+assistant and fallback turns)
rag.chat.memory-max-messages=20
# Whether to enable multi-turn query rewriting
rag.chat.query-rewrite=true
# Max chars of a single chunk appended into the prompt
rag.chat.chunk-max-chars=600
# Total char budget for retrieval context (dynamically reduced by history/system template/user question;
# when exhausted, falls back to the "session too long" reply, does not guarantee total prompt limit)
rag.chat.context-max-chars=4000
# Max tokens per answer (read by ChatConfig; adjust after observing real answer lengths,
# itemized answers may be truncated)
rag.chat.max-tokens=1024
# Main LLM response read timeout in seconds, applied by RestClientCustomizer in ChatConfig;
# if gate verification shows the Customizer is not picked up by OpenAI auto-configuration,
# this config is ineffective and the Customizer bean should be removed
rag.chat.timeout-seconds=60
# Whether to log each retrieved chunk (id/score/source/text) and retrieval timing at INFO;
# 开发环境默认 true 便于联调；生产部署时建议通过配置覆盖为 false（正文可能含敏感信息，仅联调/排查时开启）
rag.chat.log-retrieval=true
# Max number of raw (pre-filter) hits to print per question; extra hits are summarized as "raw 省略 K 条"
rag.chat.log-retrieval-max-raw=10