spring.application.name=rag
# ============ Spring AI 2.0 - OpenAI ?????LM Studio? ============
# LM Studio ????????
spring.ai.openai.base-url=http://localhost:1234/v1
# LM Studio ?????????????
spring.ai.openai.api-key=lm-studio
# ?????google/gemma-4-e4b
spring.ai.openai.chat.options.model=google/gemma-4-e4b
spring.ai.openai.chat.options.temperature=0.7
# ???????text-embedding-bge-m3
spring.ai.openai.embedding.options.model=text-embedding-bge-m3
# ============ Knife4j / OpenAPI ?? ============
knife4j.enable=true
knife4j.setting.language=zh_cn
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# ============ Milvus 3.0 REST API v2 ============
# Milvus server address (REST API v2 served on gRPC port 19530)
rag.milvus.base-url=http://localhost:19530
# Target collection (knowledge base) name
# Milvus rule: only numbers, letters and underscores are allowed (no hyphen)
rag.milvus.collection=rag_xmut
# Embedding dimension: 0 = auto-detect from embedding model on first ingestion
rag.milvus.embedding-dimension=0
# ============ Document ingestion ============
# Chunks per embed+insert batch
rag.ingest.batch-size=16
# Default topK for similarity search
rag.ingest.default-top-k=5
# ============ File upload ============
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB